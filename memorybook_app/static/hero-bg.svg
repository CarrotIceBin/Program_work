<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7afe"/>
      <stop offset="100%" stop-color="#5b9bff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="400" fill="url(#bg)"/>
  <rect width="750" height="400" fill="url(#glow1)"/>
  <rect width="750" height="400" fill="url(#glow2)"/>
  
  <!-- Large refrigerator icon -->
  <g transform="translate(80, 120)" opacity="0.15">
    <rect x="0" y="0" width="100" height="180" rx="10" fill="#fff"/>
    <rect x="0" y="0" width="100" height="60" rx="10" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="65" x2="100" y2="65" stroke="#fff" stroke-width="2"/>
    <circle cx="80" cy="30" r="4" fill="#fff"/>
    <circle cx="80" cy="100" r="4" fill="#fff"/>
  </g>
  
  <!-- Washer icon -->
  <g transform="translate(220, 140)" opacity="0.12">
    <rect x="0" y="0" width="90" height="140" rx="10" fill="#fff"/>
    <circle cx="45" cy="80" r="35" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="45" cy="80" r="8" fill="#fff" opacity="0.5"/>
    <rect x="10" y="15" width="18" height="8" rx="2" fill="none" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- AC icon -->
  <g transform="translate(570, 100)" opacity="0.12">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#fff"/>
    <line x1="10" y1="75" x2="130" y2="75" stroke="#fff" stroke-width="2"/>
    <line x1="30" y1="80" x2="30" y2="100" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="80" x2="60" y2="110" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="90" y1="80" x2="90" y2="100" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="115" y1="80" x2="115" y2="95" stroke="#fff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- TV icon -->
  <g transform="translate(420, 200)" opacity="0.12">
    <rect x="0" y="0" width="120" height="75" rx="6" fill="#fff"/>
    <rect x="10" y="8" width="100" height="55" rx="3" fill="#3a7afe" opacity="0.3"/>
    <rect x="50" y="75" width="20" height="15" fill="#fff" opacity="0.6"/>
    <rect x="30" y="90" width="60" height="5" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- Small dots decoration -->
  <circle cx="650" cy="60" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="700" cy="120" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="60" cy="350" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="120" cy="370" r="5" fill="#fff" opacity="0.25"/>
  <circle cx="500" cy="350" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="680" cy="300" r="4" fill="#fff" opacity="0.3"/>
  
  <!-- Wave decoration at bottom -->
  <path d="M0,380 Q187,340 375,380 T750,380 L750,400 L0,400 Z" fill="#fff" opacity="0.08"/>
</svg>
